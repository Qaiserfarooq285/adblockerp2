<!doctype html>
<!-- Served by scripts/live_stream.py at its HTTP root (copied to index.html). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Betting Ad Blocker – Live</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
  :root { --bg:#0e1116; --panel:#171b22; --line:#262c36; --text:#e6e9ef; --muted:#8b94a3; --ok:#3fb97a; --warn:#e0a43b; --accent:#4c8dff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { display:flex; gap:12px; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  h1 { font-size:16px; margin:0; font-weight:600; display:flex; align-items:center; gap:8px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button { background:none; color:var(--muted); border:0; padding:7px 14px; font:inherit; cursor:pointer; }
  .seg button[aria-pressed="true"] { background:var(--accent); color:#fff; }
  .seg button:disabled { opacity:.4; cursor:default; }
  main { padding:16px; display:grid; gap:16px; grid-template-columns:1fr; max-width:1600px; margin:0 auto; }
  main.two { grid-template-columns:1fr 1fr; }
  @media (max-width:900px) { main.two { grid-template-columns:1fr; } }
  figure { margin:0; background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  figcaption { padding:8px 12px; color:var(--muted); font-size:12px; border-bottom:1px solid var(--line); }
  video { width:100%; display:block; background:#000; }
  #stats { max-width:1600px; margin:0 auto 24px; padding:0 16px; display:grid; gap:8px; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); }
  .s { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .s b { display:block; font-size:18px; font-variant-numeric:tabular-nums; }
  .s span { color:var(--muted); font-size:12px; }
  .s a { color:var(--accent); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--warn); display:inline-block; }
  .dot.ok { background:var(--ok); }
</style>
</head>
<body>
<header>
  <h1><span id="dot" class="dot"></span>Betting Ad Blocker — live</h1>
  <a id="opLink" href="operator.html" hidden style="color:var(--accent);margin-left:auto;margin-right:8px">Operator</a>
  <div class="seg" role="group" aria-label="View">
    <button id="bProc" aria-pressed="true">Processed</button>
    <button id="bSide" aria-pressed="false">Side by side</button>
  </div>
</header>
<main id="grid">
  <figure><figcaption id="cap">Processed stream (betting ads hidden)</figcaption><video id="main" controls muted autoplay playsinline></video></figure>
  <figure id="origFig" hidden><figcaption>Original input (not frame-synced: it runs ahead by the processing delay)</figcaption><video id="orig" controls muted autoplay playsinline></video></figure>
</main>
<section id="stats"></section>
<script>
  const base = location.pathname.endsWith("/") ? location.pathname : location.pathname.replace(/[^/]*$/, "");
  let status = {}, mode = "processed";
  function play(el, src) {
    if (el._src === src) return;
    if (el._hls) { el._hls.destroy(); el._hls = null; }
    el._src = src;
    if (!src) { el.removeAttribute("src"); return; }
    // The autoplay attribute is not honoured for a stream attached after page
    // load; start it explicitly (muted playback is always allowed).
    const start = () => el.play().catch(() => {});
    if (window.Hls && Hls.isSupported()) {
      const h = new Hls({ liveSyncDurationCount: 3, maxLiveSyncPlaybackRate: 1.1 });
      h.loadSource(src); h.attachMedia(el); el._hls = h;
      h.on(Hls.Events.MANIFEST_PARSED, start);
      h.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) { el._src = null; setTimeout(() => play(el, src), 3000); } });
    } else { el.src = src; start(); }   // Safari plays HLS natively
  }
  function render() {
    // status.stream is null when the processed stream goes elsewhere (RTMP/SRT
    // to a CDN): then only the side-by-side view is served from here.
    const stream = status.stream === null ? null : base + (status.stream || "out/index.m3u8");
    const synced = status.compare ? base + status.compare : null;
    const rawInput = /^https?:.*\.m3u8/.test(status.input || "") ? status.input : null;
    if (!stream && synced) mode = "side";
    document.getElementById("bProc").disabled = !stream;
    document.getElementById("bProc").setAttribute("aria-pressed", mode === "processed");
    document.getElementById("bSide").setAttribute("aria-pressed", mode === "side");
    document.getElementById("bSide").disabled = !synced && !rawInput;
    const two = mode === "side" && !synced;   // fallback: two unsynced players
    document.getElementById("grid").classList.toggle("two", two);
    document.getElementById("origFig").hidden = !two;
    document.getElementById("cap").textContent = mode === "side" && synced
      ? "Original | processed, the same frame side by side"
      : "Processed stream (betting ads hidden)";
    play(document.getElementById("main"), mode === "side" && synced ? synced : stream);
    play(document.getElementById("orig"), two ? rawInput : null);
  }
  document.getElementById("bProc").onclick = () => { mode = "processed"; render(); };
  document.getElementById("bSide").onclick = () => { mode = "side"; render(); };

  const fields = [["fps_in", "input fps"], ["fps_out", "output fps"], ["processing_latency_s", "processing delay (s)"],
                  ["det_interval", "detector every N frames"], ["queue", "input queue"], ["dropped", "dropped frames"],
                  ["reconnects", "input reconnects"], ["tracks", "boards tracked"]];
  async function refresh() {
    try {
      const r = await fetch(base + "status.json", { cache: "no-store" });
      status = await r.json();
      document.getElementById("dot").classList.toggle("ok", status.fps_out > 0);
      document.getElementById("opLink").hidden = !status.operator;
      const rec = status.recording
        ? `<div class="s"><b><a href="${base + status.recording}" download>Download</a></b><span>recording so far (<a href="${base}recordings/">all</a>)</span></div>` : "";
      document.getElementById("stats").innerHTML = fields.map(([k, label]) =>
        `<div class="s"><b>${status[k] ?? "–"}</b><span>${label}</span></div>`).join("") + rec +
        `<div class="s"><b>${status.time ? status.time.slice(11) : "–"}</b><span>last update</span></div>`;
      render();
    } catch (e) { document.getElementById("dot").classList.remove("ok"); }
  }
  refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
